name: ShieldAI Security Audit

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ShieldAI
        uses: ./
        with:
          fail_on_critical: 'true'
